server:
  port: 8088
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dienmayxanh?useSSL=false&serverTimezone=UTC
    username: root
    password: YOUR_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
