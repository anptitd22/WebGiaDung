    hibernate:
      ddl-auto: none # Tùy ch?n: validate, update, create, create-drop #de none de khong cap ngat database
    properties:
      hibernate:
      dialect: org.hibernate.dialect.MySQL8Dialect
      format-sql: true # ??nh d?ng câu SQL ??p h?n
api:
  prefix: api/v1